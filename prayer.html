 <link rel="stylesheet" href="chatbot.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-branding">HGI MINISTRY</a>
          <ul class="nav-menu">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Home</a>

            <li class="nav-item">

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
     </nav>
  </header>

  <main class="container">
    <button class="chat-toggle-btn" onclick="toggleChat()">💬</button>

    <div class="floating-chatbot" id="floatingChatbot">
        <h2>HGI Ministry Chat
            <div class="bot-image"><img src="logo.png" alt=""></div>
        </h2>
        <div class="floating-chatbox" id="chatbox"></div>
        <input type="text" class="floating-chat-input" id="chat-input" placeholder="Ask me anything...">
     </div>
  </main>

  <form>
    <h3>Prayer Request</h3>
    <input type="text" placeholder="Your Name" required />
    <input type="email" placeholder="Your Email" required />
    <textarea rows="5" placeholder="Your Prayer Request..." required></textarea>
    <button type="submit">Send Prayer</button>
  </form>
